spring.application.name=financeiro

# Banco de dados
# O spring-boot-docker-compose sobe o servico definido em compose.yaml e injeta a conexao
# automaticamente em desenvolvimento. Os valores abaixo servem de fallback (ex.: producao,
# CI ou banco ja rodando fora do Docker) e podem ser sobrescritos por variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DB_USERNAME:financeiro}
spring.datasource.password=${DB_PASSWORD:financeiro}

# JPA / Hibernate
# TODO: trocar por migracoes versionadas (Flyway ou Liquibase) antes de ir para producao.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Documentacao da API
springdoc.swagger-ui.path=/swagger-ui.html

google.oauth.client-id=524138583588-l1uv1077i7h8rnfbh6tjae0e8lv4u6do.apps.googleusercontent.com
