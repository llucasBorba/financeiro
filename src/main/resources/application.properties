spring.application.name=financeiro

# Perfil ativo. Variaveis de ambiente tem precedencia sobre este arquivo, entao em producao
# basta exportar SPRING_PROFILES_ACTIVE=prod para sobrescrever sem tocar no codigo.
spring.profiles.active=dev

# Banco de dados
# O spring-boot-docker-compose sobe o servico definido em compose.yaml e injeta a conexao
# automaticamente em desenvolvimento. Os valores abaixo servem de fallback (ex.: producao,
# CI ou banco ja rodando fora do Docker) e podem ser sobrescritos por variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DB_USERNAME:financeiro}
spring.datasource.password=${DB_PASSWORD:financeiro}

# JPA / Hibernate
# O esquema pertence ao Flyway (src/main/resources/db/migration). O Hibernate NAO cria
# nem altera nada: com 'validate' ele apenas compara as @Entity com as tabelas e recusa
# subir se divergirem. Assim uma entidade alterada sem a migracao correspondente falha
# no startup, e nao em producao com uma coluna faltando.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Migracoes de banco
spring.flyway.enabled=true
# Em um banco que JA tem tabelas mas nunca rodou Flyway, ligue baseline-on-migrate: ele
# marca o estado atual como ja aplicado em vez de tentar recriar tudo. E o que se usa ao
# adotar Flyway em um sistema em producao.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}

# Documentacao da API
springdoc.swagger-ui.path=/swagger-ui.html

# Assinatura dos tokens que emitimos.
# Sem valor padrao de proposito: em producao, faltando JWT_SECRET a aplicacao nao sobe.
# Um segredo com padrao e um segredo publico. Minimo de 32 bytes (HS256).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:financeiro-api}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}

google.oauth.client-id=524138583588-l1uv1077i7h8rnfbh6tjae0e8lv4u6do.apps.googleusercontent.com
