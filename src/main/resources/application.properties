spring.application.name=financeiro

# Perfil ativo. Variaveis de ambiente tem precedencia; em producao exporte
# SPRING_PROFILES_ACTIVE=prod.
#
# ATENCAO: 'dev' como padrao significa que ESQUECER essa variavel no deploy roda a aplicacao
# em modo de desenvolvimento. Deixou de ser falha de seguranca quando o segredo literal saiu
# do repositorio, mas continua errado: defina o profile explicitamente.
spring.profiles.active=dev

# Banco de dados
# O spring-boot-docker-compose sobe o servico definido em compose.yaml e injeta a conexao
# automaticamente em desenvolvimento. Os valores abaixo servem de fallback (ex.: producao,
# CI ou banco ja rodando fora do Docker) e podem ser sobrescritos por variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DB_USERNAME:financeiro}
spring.datasource.password=${DB_PASSWORD:financeiro}

# JPA / Hibernate
# O esquema pertence ao Flyway (src/main/resources/db/migration). O Hibernate NAO cria
# nem altera nada: com 'validate' ele apenas compara as @Entity com as tabelas e recusa
# subir se divergirem. Assim uma entidade alterada sem a migracao correspondente falha
# no startup, e nao em producao com uma coluna faltando.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Migracoes de banco
spring.flyway.enabled=true
# Em um banco que JA tem tabelas mas nunca rodou Flyway, ligue baseline-on-migrate: ele
# marca o estado atual como ja aplicado em vez de tentar recriar tudo. E o que se usa ao
# adotar Flyway em um sistema em producao.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}

# Documentacao da API
springdoc.swagger-ui.path=/swagger-ui.html

# Assinatura dos tokens que emitimos. NUNCA versione um valor aqui.
#
# Vazio por padrao: fora do profile 'dev' a aplicacao recusa subir sem JWT_SECRET; em
# desenvolvimento um segredo aleatorio e gerado a cada inicializacao. Ver JwtConfig.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:financeiro-api}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}

google.oauth.client-id=524138583588-l1uv1077i7h8rnfbh6tjae0e8lv4u6do.apps.googleusercontent.com

# Origem real do cliente, quando a aplicacao roda atras de um proxy (Render, Cloud Run, nginx).
#
# A trava de tentativas de login conta por (e-mail + origem). Sem isto, atras de um proxy
# getRemoteAddr() devolve sempre o IP do proxy: todos os usuarios cairiam na mesma origem e a
# chave voltaria a ser so o e-mail — que e exatamente o desenho que permite trancar alguem de
# fora da propria conta.
#
# 'framework' faz o Spring resolver o IP a partir do X-Forwarded-For. So ative quando houver
# MESMO um proxy confiavel na frente: sem proxy, o cliente forja o cabecalho e escapa da trava.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
