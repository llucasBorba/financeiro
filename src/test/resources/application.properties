spring.application.name=financeiro-test

# Os testes rodam contra H2 em memoria, sem depender do Docker.
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:h2:mem:financeiro;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

google.oauth.client-id=test-client-id
