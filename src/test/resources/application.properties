spring.application.name=financeiro-test

# Os testes rodam com o profile 'dev' para ter um CurrentUserProvider disponivel.
# Isso tambem carrega application-dev.properties (que so traz o usuario padrao).
spring.profiles.active=dev

# Os testes rodam contra H2 em memoria, sem depender do Docker.
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:h2:mem:financeiro;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Os testes rodam as MESMAS migracoes que producao. E o que garante que os arquivos SQL
# funcionam: um erro de sintaxe ou uma coluna esquecida quebra a suite, nao o deploy.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

google.oauth.client-id=test-client-id
